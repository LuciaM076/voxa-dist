<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" fill="none">
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1120" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#041018"/>
      <stop offset="1" stop-color="#0a1f2e"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="340" fill="url(#vbg)"/>
  <circle cx="900" cy="80" r="100" fill="#00d4aa" opacity=".1"/>

  <!-- Main dashboard -->
  <rect x="80" y="40" width="960" height="260" rx="18" fill="#0c1820" stroke="rgba(0,212,170,.3)" stroke-width="2"/>
  <rect x="110" y="70" width="200" height="24" rx="6" fill="rgba(0,212,170,.2)"/>
  <rect x="110" y="110" width="280" height="160" rx="12" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>
  <path d="M130 220c25-40 50-40 75 0s50 40 75 0 50-40 75 0 50 40 75 0" stroke="#00d4aa" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="130" y="140" fill="#8fa8b8" font-family="system-ui,sans-serif" font-size="12">Live call waveform</text>

  <!-- Queue stats -->
  <rect x="420" y="110" width="180" height="70" rx="12" fill="rgba(0,212,170,.08)" stroke="rgba(0,212,170,.25)"/>
  <text x="440" y="140" fill="#00d4aa" font-family="system-ui,sans-serif" font-size="28" font-weight="700">12</text>
  <text x="440" y="162" fill="#8fa8b8" font-family="system-ui,sans-serif" font-size="12">In queue</text>

  <rect x="620" y="110" width="180" height="70" rx="12" fill="rgba(77,171,247,.08)" stroke="rgba(77,171,247,.25)"/>
  <text x="640" y="140" fill="#4dabf7" font-family="system-ui,sans-serif" font-size="28" font-weight="700">98%</text>
  <text x="640" y="162" fill="#8fa8b8" font-family="system-ui,sans-serif" font-size="12">Answer rate</text>

  <!-- Agent list -->
  <rect x="420" y="200" width="380" height="70" rx="12" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>
  <circle cx="450" cy="235" r="14" fill="rgba(0,212,170,.3)"/>
  <rect x="475" y="225" width="100" height="10" rx="5" fill="rgba(255,255,255,.15)"/>
  <rect x="475" y="242" width="70" height="8" rx="4" fill="rgba(255,255,255,.08)"/>
  <circle cx="560" cy="235" r="8" fill="#00d4aa"/>
  <text x="578" y="239" fill="#8fa8b8" font-family="system-ui,sans-serif" font-size="11">On call</text>

  <!-- Phone icon -->
  <circle cx="920" cy="190" r="50" fill="rgba(0,212,170,.12)" stroke="#00d4aa" stroke-width="2"/>
  <path d="M905 175c0-8 6-14 15-14s15 6 15 14v30c0 8-6 14-15 14s-15-6-15-14v-30z" stroke="#00d4aa" stroke-width="2.5" fill="none"/>
  <path d="M912 168h16" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
</svg>
