<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 315" fill="none" role="img" aria-label="Secure payment processing">
  <defs>
    <linearGradient id="payBg" x1="0" y1="0" x2="560" y2="315" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060d12"/>
      <stop offset="1" stop-color="#0c1820"/>
    </linearGradient>
    <linearGradient id="payTeal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#4dabf7"/>
    </linearGradient>
  </defs>
  <rect width="560" height="315" rx="18" fill="url(#payBg)"/>
  <circle cx="480" cy="60" r="80" fill="#00d4aa" opacity=".08"/>
  <circle cx="80" cy="260" r="70" fill="#4dabf7" opacity=".08"/>

  <!-- Shield -->
  <path d="M280 48l88 36v58c0 42-38 68-88 78-50-10-88-36-88-78V84l88-36z" fill="rgba(0,212,170,.12)" stroke="#00d4aa" stroke-width="2.5"/>
  <path d="M248 118l24 24 48-56" stroke="#00d4aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Credit card -->
  <rect x="72" y="168" width="200" height="118" rx="14" fill="#0f1a28" stroke="rgba(77,171,247,.4)" stroke-width="2"/>
  <rect x="92" y="188" width="56" height="38" rx="6" fill="rgba(255,193,7,.25)" stroke="rgba(255,193,7,.5)" stroke-width="1.5"/>
  <rect x="92" y="242" width="120" height="10" rx="5" fill="rgba(255,255,255,.15)"/>
  <rect x="92" y="260" width="80" height="8" rx="4" fill="rgba(255,255,255,.08)"/>
  <rect x="220" y="242" width="32" height="10" rx="5" fill="rgba(255,255,255,.12)"/>

  <!-- Lock / TLS -->
  <rect x="320" y="168" width="168" height="118" rx="14" fill="#0f1a28" stroke="rgba(0,212,170,.35)" stroke-width="2"/>
  <rect x="376" y="198" width="56" height="44" rx="8" fill="rgba(0,212,170,.15)" stroke="#00d4aa" stroke-width="2"/>
  <path d="M388 198v-10c0-8 6-14 16-14s16 6 16 14v10" stroke="#00d4aa" stroke-width="2" fill="none"/>
  <circle cx="404" cy="224" r="5" fill="#00d4aa"/>
  <rect x="348" y="256" width="112" height="8" rx="4" fill="rgba(255,255,255,.12)"/>
  <rect x="360" y="272" width="88" height="6" rx="3" fill="rgba(255,255,255,.08)"/>

  <!-- Payment chips -->
  <rect x="320" y="118" width="52" height="32" rx="8" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/>
  <rect x="382" y="118" width="52" height="32" rx="8" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/>
  <rect x="444" y="118" width="44" height="32" rx="8" fill="rgba(0,212,170,.12)" stroke="rgba(0,212,170,.3)"/>
</svg>
